<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#251e17" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <meta name="apple-mobile-web-app-title" content="Valombre" />
  <meta name="application-name" content="La Grotte de Valombre" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="La Grotte de Valombre — livre-jeu interactif médiéval fantastique." />
  <title>La Grotte de Valombre — Livre-jeu</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=EB+Garamond:wght@500;600&display=swap');



:root {
  --desk: #1a1511;
  --desk2: #2a2119;
  --paper: #eadcb9;
  --paper-light: #f1e6cc;
  --paper-mid: #e6d5af;
  --paper-edge: #b79e72;
  --paper-edge-dark: #856a46;
  --ink: #1a1410;
  --ink-soft: #5a4938;
  --rule: #765c39;
  --rule-light: #c0a16a;
  --cartouche: #2d2017;
  --cartouche-light: #493527;
  --gold: #9b7a49;
  --danger: #71372f;
  --body-font: 'EB Garamond', Garamond, 'Times New Roman', serif;
  --display-font: 'Cormorant Garamond', Garamond, 'Times New Roman', serif;
}


* { box-sizing: border-box; }
html, 
body {
  margin: 0;
  color: var(--ink);
  font-family: var(--body-font);
  font-kerning: normal;
  font-variant-ligatures: common-ligatures;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  background:
    radial-gradient(ellipse at 50% -10%, rgba(171,128,73,.11), transparent 42%),
    linear-gradient(180deg, var(--desk2), var(--desk));
}

button { font: inherit; }


.app-shell {
  min-height: 100vh;
  max-width: 1060px;
  margin: 0 auto;
  padding: max(12px, env(safe-area-inset-top)) 18px calc(112px + env(safe-area-inset-bottom));
}

.topbar {
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:16px;
  padding: 8px 6px 14px;
  color: #dcc79b;
}
.topbar h1 {
  margin: 0;
  font-family: var(--display-font);
  font-size: clamp(24px, 4.6vw, 34px);
  line-height: 1;
  font-weight: 600;
  letter-spacing: .01em;
}
.eyebrow {
  margin-bottom: 4px;
  font-family: var(--body-font);
  letter-spacing: .16em;
  font-size: 11px;
  color: #bea375;
}
.icon-btn {
  border: 1px solid rgba(180,153,109,.52);
  background: linear-gradient(180deg, rgba(73,55,38,.95), rgba(42,31,22,.95));
  color: #ead9b3;
  border-radius: 0;
  width: 42px;
  height: 42px;
  cursor: pointer;
  font-family: var(--body-font);
  font-size: 20px;
  box-shadow: inset 0 0 0 1px rgba(27,18,11,.45);
}



/* Page unique : on reproduit une page de livre-jeu imprimé, pas une interface web moderne. */
.game {
  position: relative;
  padding: 16px 16px 24px;
  border: 1px solid #89704b;
  background:
    radial-gradient(circle at 12% 18%, rgba(126,94,54,.035) 0 1.2px, transparent 1.9px),
    radial-gradient(circle at 76% 70%, rgba(126,94,54,.028) 0 1px, transparent 1.7px),
    linear-gradient(180deg, var(--paper-light), var(--paper-mid));
  box-shadow:
    0 0 0 2px rgba(102,79,48,.22),
    0 20px 52px rgba(0,0,0,.24);
}
.game .print-grain { display:none; }
.game::before,
.game::after {
  content:'';
  position:absolute;
  pointer-events:none;
}
.game::before {
  inset: 6px;
  border: 1px solid rgba(116,90,56,.62);
  box-shadow:
    inset 0 0 0 1px rgba(241,231,206,.92),
    inset 0 0 0 5px rgba(163,134,87,.10);
}
.game::after {
  inset: 0;
  background:
    linear-gradient(90deg, rgba(71,52,32,.13), transparent 2.1%, transparent 97.9%, rgba(71,52,32,.11)),
    linear-gradient(180deg, rgba(71,52,32,.09), transparent 2.2%, transparent 97.6%, rgba(71,52,32,.09));
  opacity: .55;
  mix-blend-mode: multiply;
}

.game::before {
  inset: 8px;
  border: 1px solid rgba(92,68,39,.72);
  outline: 1px solid rgba(163,133,85,.48);
  outline-offset: -4px;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.17);
}
.game::after {
  inset: 0;
  opacity: .28;
  background:
    linear-gradient(90deg, rgba(64,43,24,.26), transparent 2.1%, transparent 97.6%, rgba(64,43,24,.20)),
    linear-gradient(180deg, rgba(64,43,24,.13), transparent 2.6%, transparent 97.2%, rgba(64,43,24,.13));
  mix-blend-mode: multiply;
}



.image-frame {
  position: relative;
  z-index: 2;
  aspect-ratio: 4/3;
  margin: 6px 6px 0;
  border: 1px solid #6e5739;
  background: #cab995;
  overflow: hidden;
  box-shadow:
    inset 0 0 0 1px rgba(245,235,211,.95),
    inset 0 0 0 4px rgba(104,82,52,.46);
}
.image-frame::after {
  content:'';
  position:absolute;
  inset:0;
  pointer-events:none;
  box-shadow:
    inset 0 0 0 6px rgba(236,225,198,.18),
    inset 0 0 20px rgba(26,18,12,.10);
}
.story-image { width:100%; height:100%; display:block; object-fit:cover; object-position:center; }
.story-image.hidden { display:none; }
.image-placeholder {
  width:100%; height:100%;
  display:grid;
  place-content:center;
  gap:8px;
  text-align:center;
  background: linear-gradient(180deg, #d7c5a3, #cfbb94);
  color:#5e4c37;
  font-family:var(--body-font);
}
.image-placeholder span { font-size:13px; letter-spacing:.06em; }
.image-placeholder small { font-size:11px; letter-spacing:.02em; opacity:.9; }





.story-card {
  position:relative;
  z-index:2;
  margin: 18px 18px 0;
  padding: 0 26px 0;
  background: transparent;
  border: 0;
}
.chapter-number {
  display:block;
  margin: 0 0 8px;
  color:#6a563c;
  font-family:var(--body-font);
  font-size:14px;
  letter-spacing:.02em;
  text-align:right;
}
.story-card h2 {
  margin: 0 0 16px;
  text-align:center;
  color:#221912;
  font-family:var(--display-font);
  font-size: clamp(40px, 6vw, 58px);
  line-height: 1;
  font-weight: 600;
  letter-spacing: 0;
}
.story-card h2::after { content:none; }




.story-text {
  max-width: 860px;
  margin: 0 auto;
  color:#19130f;
  font-family:var(--body-font);
  font-size: clamp(21px, 2.65vw, 25px);
  line-height: 1.22;
  font-weight: 500;
  letter-spacing: -.004em;
  text-align: left;
  hyphens: none;
}
.story-text p {
  margin: 0 0 .28em;
  text-indent: 0;
}
.story-text p:first-child { text-indent:0; }
.story-text p:first-child::first-letter {
  float:none;
  margin:0;
  color:inherit;
  font-family:inherit;
  font-size:inherit;
  line-height:inherit;
}




.story-text blockquote {
  margin: .9em 0;
  padding: 0;
  border: 0;
  color:#2f2419;
  font-style: italic;
  text-align:center;
  background:none;
}


.story-text ul { padding-left:1.25em; }
.story-text .ending {
  margin:27px auto 0;
  padding:13px 14px;
  border-top:4px double #826846;
  border-bottom:4px double #826846;
  text-align:center;
  color:#563923;
  font-family:var(--display-font);
  font-weight:600;
  letter-spacing:.10em;
}


.status-tags {
  position:fixed;
  left:50%;
  bottom:max(8px, env(safe-area-inset-bottom));
  transform:translateX(-50%);
  z-index:25;
  width:min(940px, calc(100vw - 20px));
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:6px;
  margin:0;
  padding:7px;
  border:1px solid #795d3e;
  box-shadow:0 9px 26px rgba(20,13,8,.28), inset 0 0 0 2px rgba(255,255,255,.18);
  background:rgba(237,222,188,.97);
  backdrop-filter:blur(7px);
}
.status-tags:empty { display:none; }
.tag {
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  border:1px solid rgba(122,96,60,.40);
  background:rgba(255,255,255,.20);
  color:#4e3825;
  padding:6px 7px;
  font-family:var(--body-font);
}
.tag-icon { flex:0 0 auto; font-size:17px; line-height:1; color:#6b4830; }
.tag-copy { min-width:0; display:flex; flex-direction:column; line-height:1.05; }
.tag-copy small { font-size:10px; letter-spacing:.035em; color:#725a40; white-space:nowrap; }
.tag-copy strong { margin-top:2px; font-size:16px; color:#24180f; white-space:nowrap; }
.tag.status-warning { border-color:#9a7134; background:rgba(164,119,49,.12); }
.tag.status-critical { border-color:#87483b; background:rgba(135,58,48,.13); }
.tag.status-critical .tag-copy strong { color:#71372f; }



/* Cartouches de choix : inspirés d'une maquette de livre imprimé, pas d'une UI moderne. */
.choices {
  position:relative;
  display:grid;
  grid-template-columns:minmax(0, 1fr);
  grid-auto-rows:1fr; /* Tous les choix d’une page prennent la hauteur du plus grand. */
  align-items:stretch;
  width:100%;
  gap: 14px;
  margin: 22px auto 6px;
  padding-top: 4px;
  max-width: 860px;
}
.choice-btn {
  position:relative;
  display:flex;
  align-items:stretch;
  width:100%;
  min-height:140px;
  border:1px solid #896d48;
  background: linear-gradient(180deg, #efe2c3, #ecdcbc);
  color:var(--ink);
  padding: 18px 18px 54px;
  border-radius:0;
  cursor:pointer;
  box-shadow:
    inset 0 0 0 1px rgba(243,234,212,.98),
    inset 0 0 0 4px rgba(121,95,62,.28);
  transition:none;
}
.choice-btn::before,
.choice-btn::after {
  content:'';
  position:absolute;
  width:14px;
  height:14px;
  border-color:#a18255;
}
.choice-btn::before {
  left:8px;
  top:8px;
  border-left:1px solid;
  border-top:1px solid;
}
.choice-btn::after {
  right:8px;
  top:8px;
  border-right:1px solid;
  border-top:1px solid;
}
.choice-btn:hover { filter:none; transform:none; }
.choice-copy {
  display:flex;
  flex:1;
  flex-direction:column;
  justify-content:center;
  text-align:center;
  font-family:var(--body-font);
  font-size:20px;
  line-height:1.18;
  font-weight:500;
}
.choice-dest {
  position:absolute;
  left:8px;
  right:8px;
  bottom:8px;
  min-height:36px;
  display:grid;
  place-items:center;
  padding: 6px 10px;
  border:1px solid #20160f;
  background: linear-gradient(180deg, #453125, #2b2018);
  color:#efdfbd;
  font-family:var(--body-font);
  font-size:17px;
  font-weight:600;
  letter-spacing:0;
}
.choice-dest::before,
.choice-dest::after { content:''; margin:0; }
/* Chaque choix occupe toute la largeur, quel que soit leur nombre. */
.choice-btn {
  grid-column:1;
  justify-self:stretch;
  max-width:none;
}




.footer {
  position: static;
  width: min(860px,100%);
  margin: 16px auto 0;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:0;
  background:none;
}
.footer-btn, .drawer-action {
  border:1px solid rgba(166,136,93,.58);
  background: linear-gradient(180deg, #4e3929, #2b1f17);
  color:#efe0ba;
  padding: 11px 13px;
  border-radius:0;
  cursor:pointer;
  font-family:var(--body-font);
  font-size:15px;
  box-shadow: inset 0 0 0 1px rgba(30,21,15,.5);
}
.footer-btn span {
  display:inline-grid;
  place-items:center;
  min-width:20px;
  height:20px;
  margin-left:4px;
  background:#b99762;
  color:#1e1710;
  font-size:11px;
  font-weight:700;
}

.danger { color:#e5c1b4; }

.backdrop { position:fixed; inset:0; background:rgba(0,0,0,.61); backdrop-filter:blur(3px); z-index:30; }
.hidden { display:none !important; }

.drawer {
  position:fixed;
  top:0;
  right:0;
  width:min(360px,88vw);
  height:100%;
  z-index:40;
  color:var(--ink);
  background:linear-gradient(180deg, #efe2c0, #e2cf9f);
  border-left:1px solid #7b6546;
  padding:max(18px,env(safe-area-inset-top)) 18px 18px;
  transform:translateX(102%);
  transition:transform .2s ease;
  box-shadow:-16px 0 38px rgba(0,0,0,.34);
}
.drawer.open { transform:translateX(0); }
.drawer-head { display:flex; justify-content:space-between; align-items:center; gap:12px; }
.drawer-head h3 { margin:0; font-family:var(--display-font); font-size:30px; font-weight:600; }
.drawer .icon-btn,.modal .icon-btn { color:#34271b; background:transparent; border-color:#8b7452; box-shadow:none; }
.drawer-action { display:block; width:100%; text-align:left; margin-top:12px; background:rgba(83,61,39,.08); color:#392b1f; border-color:#907552; }
.drawer-note { margin-top:22px; color:#6b5a45; font:14px/1.4 var(--body-font); }
.danger-text { color:#793f36; }

/* Navigation directe des pages — outil de test. */
.drawer.page-drawer {
  display:flex;
  flex-direction:column;
  width:min(430px,92vw);
  padding-bottom:max(14px,env(safe-area-inset-bottom));
}
.page-nav-list {
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  margin:16px -8px 0;
  padding:0 8px 18px;
  overscroll-behavior:contain;
  scrollbar-width:thin;
  scrollbar-color:#8e7350 transparent;
}
.page-nav-btn {
  width:100%;
  display:grid;
  grid-template-columns:54px minmax(0,1fr);
  align-items:center;
  gap:10px;
  padding:10px 9px;
  margin:0;
  border:0;
  border-bottom:1px solid rgba(117,91,57,.28);
  background:transparent;
  color:#312419;
  text-align:left;
  cursor:pointer;
  font-family:var(--body-font);
}
.page-nav-btn:hover { background:rgba(95,69,43,.08); }
.page-nav-btn.current {
  background:rgba(95,69,43,.13);
  box-shadow:inset 3px 0 0 #795a36;
}
.page-nav-number {
  color:#785d3d;
  font-size:13px;
  letter-spacing:.05em;
  font-variant-numeric:tabular-nums;
}
.page-nav-title {
  min-width:0;
  font-size:17px;
  line-height:1.1;
  font-weight:600;
}
@media (max-width:620px) {
  .drawer.page-drawer { width:min(390px,94vw); }
  .page-nav-btn { grid-template-columns:50px minmax(0,1fr); padding:10px 7px; }
  .page-nav-title { font-size:16px; }
}


.modal { position:fixed; inset:0; z-index:50; display:grid; place-items:center; padding:18px; }

.modal-card {
  width:min(520px,100%);
  max-height:80vh;
  overflow:auto;
  color:var(--ink);
  background:linear-gradient(180deg, #f1e5c4, #e5d3a9);
  border:1px solid #806847;
  border-radius:0;
  padding:18px;
  box-shadow:0 18px 40px rgba(0,0,0,.32);
}
.inventory-list { display:grid; gap:10px; margin-top:16px; }
.inventory-item { padding:12px; border:1px solid #987d57; background:rgba(255,255,255,.14); }
.inventory-item strong { display:block; color:#6c4a2e; margin-bottom:4px; }
.inventory-empty { color:#6b5a45; margin-top:14px; }



@media (max-width:620px) {
  .app-shell { padding-left:10px; padding-right:10px; }
  .topbar { padding-left:2px; padding-right:2px; }
  .topbar h1 { font-size:26px; }
  .game { padding: 12px 12px 20px; box-shadow: 0 14px 36px rgba(0,0,0,.24); }
  .game::before { inset: 5px; }
  .image-frame { margin: 4px 4px 0; }
  .story-card { margin: 14px 10px 0; padding:0 8px; }
  .chapter-number { font-size:13px; }
  .story-card h2 { font-size: 32px; margin-bottom: 12px; }
  .story-text { font-size: 18px; line-height: 1.22; }
  .choices { grid-template-columns:1fr; gap:12px; }
    .choice-btn { min-height: 120px; padding: 14px 12px 48px; }
  .choice-copy { font-size: 17px; }
  .choice-dest { font-size: 15px; min-height: 32px; }
  .footer { grid-template-columns:1fr 1fr; }
}


/* Sur petit écran, conserver une colonne et des zones tactiles confortables. */
@media (max-width:620px) {
  .choices { grid-template-columns:minmax(0,1fr); gap:12px; margin-top:27px; }
  .choice-btn { min-height:120px; }
  .choice-copy { font-size:17px; }
}

  
/* =========================================================
   AJOUTS FONCTIONNELS — le design principal des pages reste intact.
   ========================================================= */

.footer {
  grid-template-columns: repeat(4, 1fr);
}

.hero-sheet {
  max-width: 690px;
  margin: 0 auto 18px;
  padding: 16px;
  border: 1px solid #927653;
  background: rgba(255,255,255,.10);
  box-shadow: inset 0 0 0 3px rgba(126,94,56,.07);
}

.hero-sheet-row {
  display:grid;
  grid-template-columns: 125px 1fr;
  gap:14px;
  padding:7px 0;
  border-bottom:1px solid rgba(103,77,46,.22);
}

.hero-label {
  color:#65492f;
  font-variant:small-caps;
  letter-spacing:.05em;
}

.hero-value {
  color:#21170f;
}

.hero-name-input {
  width:100%;
  border:0;
  border-bottom:1px solid #806442;
  border-radius:0;
  outline:none;
  padding:3px 2px 5px;
  background:transparent;
  color:#21170f;
  font-family:var(--body-font);
  font-size:19px;
}

.hero-sheet-grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  margin-top:14px;
}

.hero-stat {
  display:flex;
  justify-content:space-between;
  gap:12px;
  border:1px solid #9a7e58;
  padding:9px 11px;
  background:rgba(255,255,255,.08);
}

.hero-stat strong {
  color:#694a2e;
}

.hero-weapon {
  margin-top:12px;
  text-align:center;
  color:#49331f;
  font-style:italic;
}

.hero-stat-wide {
  grid-column: 1 / -1;
}

.hero-characteristics,
.combat-rules-card,
.tests-rules-card {
  margin-top:14px;
  padding:12px 14px;
  border:1px solid #927653;
  background:rgba(255,255,255,.07);
  color:#3d2a1c;
}

.hero-characteristics p {
  margin:.42em 0;
  line-height:1.34;
}

.hero-info-title,
.combat-rules-title {
  margin-bottom:8px;
  font-family:var(--display-font);
  text-transform:uppercase;
  letter-spacing:.065em;
  font-weight:700;
  color:#4c3221;
}

.combat-rules-card {
  border:2px solid #765335;
  box-shadow:inset 0 0 0 3px rgba(124,91,52,.08);
  background:rgba(103,72,43,.10);
}

.combat-rules-title {
  font-size:20px;
  text-align:center;
  padding-bottom:7px;
  border-bottom:1px solid rgba(110,79,46,.36);
}

.combat-rules-card p,
.tests-rules-card {
  line-height:1.42;
}

.combat-detail {
  color:#6a5037;
  font-size:.9em;
}

.parchment-verse {
  max-width:650px;
  margin:18px auto;
  padding:14px 18px;
  border-top:1px solid #94764f;
  border-bottom:1px solid #94764f;
  text-align:center;
  color:#342419;
  font-style:italic;
  background:rgba(255,255,255,.07);
}

.weapon-compare {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin:16px 0;
}

.weapon-compare > div {
  border:1px solid #9a7e58;
  padding:11px;
  background:rgba(255,255,255,.08);
  text-align:center;
}

.inventory-topline {
  margin:12px 0 4px;
  color:#6c5338;
  font-style:italic;
}

.inventory-item p {
  margin:.25em 0 0;
}

.inventory-actions {
  margin-top:10px;
}

.inventory-action-btn {
  width:100%;
  border:1px solid rgba(224,205,164,.36);
  outline:1px solid rgba(69,49,31,.75);
  outline-offset:-4px;
  background:linear-gradient(180deg, #57432f, #35281d);
  color:#efe1bd;
  padding:10px 12px;
  border-radius:1px;
  cursor:pointer;
  font-family:var(--body-font);
  font-size:14px;
}

.inventory-action-btn:disabled {
  opacity:.42;
  cursor:default;
}

.inventory-parchment-image {
  display:block;
  width:100%;
  max-width:430px;
  margin:12px auto 16px;
  border:1px solid #806746;
}

/* V68.44 — Journal de bord, une simple liste de découvertes. */
.journal-panel {position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(26,19,13,.72);color:#30251a;}
.journal-panel.hidden {display:none !important;}
.journal-sheet {display:flex;flex-direction:column;width:min(100%,720px);max-height:calc(100dvh - 36px);overflow:hidden;background:#f5e8c9;border:5px double #92714c;box-shadow:0 14px 42px rgba(0,0,0,.42);}
.journal-head {display:flex;align-items:center;justify-content:space-between;gap:14px;padding:20px 24px 14px;border-bottom:1px solid #baa17c;}
.journal-kicker {font-size:10px;letter-spacing:.15em;color:#795d3b;font-weight:700;}
.journal-head h3 {font-family:var(--display-font);font-size:clamp(27px,5vw,38px);margin:4px 0 0;}
.journal-close {width:44px;height:44px;flex-shrink:0;font-size:30px;cursor:pointer;background:transparent;border:1px solid #a88c64;color:#423020;}
.journal-content {overflow-y:auto;overscroll-behavior:contain;padding:12px 24px 28px;min-height:0;}
.journal-count {font-size:12px;letter-spacing:.04em;color:#806743;margin:6px 0 18px;}
.journal-list {display:flex;flex-direction:column;gap:13px;}
.journal-entry {border-left:3px solid #a7834c;background:rgba(255,252,242,.42);padding:14px 16px;}
.journal-entry h4 {font-family:var(--display-font);font-size:clamp(19px,3.6vw,24px);margin:0 0 8px;line-height:1.2;color:#35291f;}
.journal-entry p {font-size:clamp(15px,2.8vw,17px);line-height:1.5;margin:0;color:#3c3024;}
.journal-empty {font-style:italic;color:#695740;line-height:1.5;}
@media(max-width:620px){.journal-panel{padding:7px}.journal-sheet{width:100%;max-height:calc(100dvh - 14px)}.journal-head{padding:16px 13px 12px}.journal-content{padding:10px 13px 20px}.journal-entry{padding:12px}}

.ending-journal-list { display:flex; flex-direction:column; gap:12px; margin-top:14px; }
.ending-journal-entry { border-left:3px solid #a7834c; background:rgba(255,252,242,.42); padding:12px 14px; }

/* V68.59 — dés visibles avant le lancer, révélés au même endroit après chaque tour. */
.combat-roll-waiting { text-align:center; }
.combat-die-pending {
  display:inline-flex; align-items:center; justify-content:center;
  font:bold 25px Georgia,serif; color:#735c45; background:#f7eed9;
}

.combat-roll-result:not(.combat-roll-waiting) .die-visual {
  animation: valombre-dice-reveal .27s ease-out both;
}
@keyframes valombre-dice-reveal {
  from { opacity:.42; transform:translateY(-5px) rotate(-8deg); }
  to { opacity:1; transform:translateY(0) rotate(0); }
}
@media (prefers-reduced-motion: reduce) {
  .combat-roll-result .die-visual { animation:none !important; }
